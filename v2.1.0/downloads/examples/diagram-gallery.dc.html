<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="lib/vendor/react.production.min.js"></script>
<script src="lib/vendor/react-dom.production.min.js"></script>
<script src="lib/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="lib/colors_and_type.css">
</helmet>
<div style="background:var(--bg);padding:56px;font-family:var(--font-body);display:flex;flex-direction:column;gap:56px;">

  <div>
    <div class="overline" style="color:var(--fg-2);margin-bottom:8px;">Sequence diagram</div>
    <div style="font-family:var(--font-heading);font-size:22px;font-weight:700;color:var(--color-primary);margin-bottom:24px;">Continuous-audit agent run</div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:32px 40px;">
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:0;position:relative;">
        <sc-for list="{{ actors }}" as="a" hint-placeholder-count="3">
          <div style="text-align:center;">
            <div style="display:inline-block;padding:8px 18px;background:var(--tag-bg);color:var(--tag-text);font-family:var(--font-heading);font-size:13px;font-weight:600;border-radius:var(--radius-sm);">{{ a }}</div>
          </div>
        </sc-for>
      </div>
      <div style="position:relative;height:220px;margin-top:4px;">
        <div style="position:absolute;left:16.6%;top:0;bottom:0;width:1px;background:var(--border-strong);"></div>
        <div style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--border-strong);"></div>
        <div style="position:absolute;left:83.3%;top:0;bottom:0;width:1px;background:var(--border-strong);"></div>
        <sc-for list="{{ messages }}" as="m" hint-placeholder-count="4">
          <div style="position:absolute;left:{{ m.from }};right:{{ m.to }};top:{{ m.top }};height:1px;background:var(--slate-9);">
            <div style="position:absolute;{{ m.arrowSide }}:-1px;top:-4px;width:0;height:0;border-top:4px solid transparent;border-bottom:4px solid transparent;{{ m.arrowBorder }}"></div>
            <div style="position:absolute;top:-22px;left:0;right:0;text-align:center;font-size:11.5px;font-family:var(--font-code);color:var(--fg-2);">{{ m.label }}</div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>

  <div>
    <div class="overline" style="color:var(--fg-2);margin-bottom:8px;">Architecture diagram</div>
    <div style="font-family:var(--font-heading);font-size:22px;font-weight:700;color:var(--color-primary);margin-bottom:24px;">Self-hosted core, portable edges</div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:40px;display:flex;flex-direction:column;align-items:center;gap:0;">
      <div style="padding:14px 28px;background:var(--color-primary);color:#fff;border-radius:var(--radius-md);font-family:var(--font-heading);font-size:14px;font-weight:600;">Self-hosted control plane</div>
      <div style="width:1px;height:32px;background:var(--border-strong);"></div>
      <div style="display:flex;gap:48px;">
        <sc-for list="{{ nodes }}" as="n" hint-placeholder-count="3">
          <div style="display:flex;flex-direction:column;align-items:center;">
            <div style="width:1px;height:16px;background:var(--border-strong);"></div>
            <div style="padding:12px 20px;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:var(--radius-md);font-family:var(--font-code);font-size:12.5px;color:var(--color-primary);white-space:nowrap;">{{ n }}</div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>

  <div>
    <div class="overline" style="color:var(--fg-2);margin-bottom:8px;">Org chart</div>
    <div style="font-family:var(--font-heading);font-size:22px;font-weight:700;color:var(--color-primary);margin-bottom:24px;">Engagement team</div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:40px;display:flex;flex-direction:column;align-items:center;">
      <div style="padding:12px 24px;background:var(--orange-9);color:#fff;border-radius:var(--radius-md);font-family:var(--font-heading);font-size:14px;font-weight:600;">Engagement lead</div>
      <div style="width:1px;height:28px;background:var(--border-strong);"></div>
      <div style="display:flex;gap:40px;position:relative;">
        <div style="position:absolute;top:-28px;left:16.6%;right:16.6%;height:1px;background:var(--border-strong);"></div>
        <sc-for list="{{ reports }}" as="r" hint-placeholder-count="3">
          <div style="display:flex;flex-direction:column;align-items:center;">
            <div style="width:1px;height:28px;background:var(--border-strong);"></div>
            <div style="padding:10px 18px;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:var(--radius-md);font-family:var(--font-body);font-size:13px;color:var(--fg-1);white-space:nowrap;">{{ r }}</div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      actors: ['CI pipeline', 'Audit agent', 'Policy store'],
      messages: [
        { from: '16.6%', to: '50%', top: '20px', label: 'merge event', arrowSide: 'right', arrowBorder: 'border-left:5px solid var(--slate-9);' },
        { from: '50%', to: '16.6%', top: '70px', label: 'fetch policy set', arrowSide: 'right', arrowBorder: 'border-left:5px solid var(--slate-9);' },
        { from: '50%', to: '16.6%', top: '120px', label: 'diff against policy', arrowSide: 'left', arrowBorder: 'border-right:5px solid var(--slate-9);' },
        { from: '16.6%', to: '50%', top: '170px', label: 'open PR if drift found', arrowSide: 'right', arrowBorder: 'border-left:5px solid var(--slate-9);' },
      ],
      nodes: ['Cloud region A', 'Cloud region B', 'On-prem cluster'],
      reports: ['Cloud architect', 'Compliance agent owner', 'Agentic AI engineer'],
    };
  }
}
</script>
</body>
</html>
