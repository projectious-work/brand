# =============================================================================
# Yazi theme — generated by aibox CLI from the active theme palette
# Docs: https://yazi-rs.github.io/docs/configuration/theme
# =============================================================================

[mgr]
cwd = { fg = "#E05232" }
hovered = { fg = "#0E1720", bg = "#C5DAF0" }
preview_hovered = { bg = "#131E2B", underline = true }
find_keyword = { fg = "#E0B85B", bold = true }
find_position = { fg = "#E3574A", italic = true }
marker_selected = { fg = "#4FB07A", bg = "#4FB07A" }
marker_copied = { fg = "#E05232", bg = "#E05232" }
marker_cut = { fg = "#E55B5B", bg = "#E55B5B" }

[tabs]
active = { fg = "#0E1720", bg = "#E05232", bold = true }
inactive = { fg = "#7B8DA3", bg = "#131E2B" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#0E1720", bg = "#4FB07A", bold = true }
normal_alt = { fg = "#4FB07A", bg = "#131E2B", bold = true }
select_main = { fg = "#0E1720", bg = "#E05232", bold = true }
select_alt = { fg = "#E05232", bg = "#131E2B", bold = true }
unset_main = { fg = "#0E1720", bg = "#E3574A", bold = true }
unset_alt = { fg = "#E3574A", bg = "#131E2B", bold = true }

[status]
overall = { fg = "#C5DAF0", bg = "#131E2B" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_type = { fg = "#E05232" }
perm_read = { fg = "#E0B85B" }
perm_write = { fg = "#E55B5B" }
perm_exec = { fg = "#4FB07A" }
perm_sep = { fg = "#7B8DA3" }
progress_label = { fg = "#C5DAF0", bold = true }
progress_normal = { fg = "#E05232", bg = "#131E2B" }
progress_error = { fg = "#E55B5B", bg = "#131E2B" }

[input]
border = { fg = "#E05232" }
title = { fg = "#E05232", bg = "#0E1720", bold = true }
value = { fg = "#C5DAF0", bg = "#0E1720" }
selected = { reversed = true }

[pick]
border = { fg = "#E05232" }
active = { fg = "#E3574A" }
inactive = { fg = "#7B8DA3", bg = "#0E1720" }

[cmp]
border = { fg = "#E05232" }
active = { fg = "#E3574A" }
inactive = { fg = "#7B8DA3", bg = "#0E1720" }

[tasks]
border = { fg = "#E05232" }
title = { fg = "#E05232", bg = "#0E1720", bold = true }
hovered = { bg = "#131E2B", underline = true }

[which]
mask = { bg = "#131E2B" }
cand = { fg = "#8AACC8" }
rest = { fg = "#7B8DA3" }
desc = { fg = "#E3574A" }
separator = "  "
separator_style = { fg = "#7B8DA3" }

[help]
on = { fg = "#8AACC8" }
run = { fg = "#E3574A" }
desc = { fg = "#C5DAF0", bg = "#0E1720" }
hovered = { bg = "#131E2B", bold = true }
footer = { fg = "#0E1720", bg = "#C5DAF0" }

[git]
modified = { fg = "#E0B85B" }
untracked = { fg = "#E3574A" }
added = { fg = "#4FB07A" }
deleted = { fg = "#E55B5B" }
updated = { fg = "#E05232" }
ignored = { fg = "#7B8DA3" }

[filetype]
rules = [
    { url = "*/", fg = "#E05232", bold = true },
    { url = "*.rs", fg = "#F2A65A" },
    { url = "*.py", fg = "#E0B85B" },
    { url = "*.js", fg = "#E0B85B" },
    { url = "*.ts", fg = "#E05232" },
    { url = "*.sh", fg = "#4FB07A" },
    { url = "*.toml", fg = "#8AACC8" },
    { url = "*.yaml", fg = "#8AACC8" },
    { url = "*.yml", fg = "#8AACC8" },
    { url = "*.json", fg = "#8AACC8" },
    { url = "*.kdl", fg = "#8AACC8" },
    { url = "*.html", fg = "#F2A65A" },
    { url = "*.css", fg = "#E05232" },
    { url = "*.md", fg = "#C5DAF0" },
    { url = "*.tex", fg = "#4FB07A" },
    { url = "*.typ", fg = "#4FB07A" },
    { url = "*.pdf", fg = "#E55B5B" },
    { url = "*.png", fg = "#E3574A" },
    { url = "*.jpg", fg = "#E3574A" },
    { url = "*.jpeg", fg = "#E3574A" },
    { url = "*.gif", fg = "#E3574A" },
    { url = "*.svg", fg = "#E3574A" },
    { url = "*.zip", fg = "#F2A65A" },
    { url = "*.tar*", fg = "#F2A65A" },
    { url = "*.gz", fg = "#F2A65A" },
    { url = "*.gitignore", fg = "#7B8DA3" },
    { url = ".env*", fg = "#E55B5B" },
    { url = "Dockerfile*", fg = "#E05232" },
    { url = "Makefile", fg = "#4FB07A" },
    { url = "Cargo.toml", fg = "#F2A65A", bold = true },
    { url = "Cargo.lock", fg = "#7B8DA3" },
]
