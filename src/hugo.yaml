baseURL: "https://projectious-work.github.io/brand/"
title: projectious.work brand
description: The brand and design system for projectious.work — colour, type, logo, components, and usage terms.
enableRobotsTXT: true
enableGitInfo: true
enableEmoji: true

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        # Without block attributes, markdown such as `{.lead .display-6}`
        # renders as visible literal text instead of applying the classes.
        block: true
        title: true
  highlight:
    noClasses: false
  tableOfContents:
    endLevel: 4

outputs:
  home: [HTML, RSS, SearchIndex, LLMS, LLMSFULL]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

outputFormats:
  SearchIndex:
    mediaType: application/json
    baseName: index
    isPlainText: true
    notAlternative: true
  Print:
    mediaType: text/html
    # Retain the public Docsy-era print URLs while using the new theme's
    # section-print layout.
    baseName: index
    path: _print
    isHTML: true
    notAlternative: true
    permalinkable: true
  Markdown:
    mediaType: text/markdown
    isPlainText: true
    permalinkable: true
  LLMS:
    mediaType: text/plain
    baseName: llms
    isPlainText: true
    notAlternative: true
  LLMSFULL:
    mediaType: text/plain
    baseName: llms-full
    isPlainText: true
    notAlternative: true

params:
  description: The brand and design system for projectious.work — colour, type, logo, components, and usage terms.
  github: https://github.com/projectious-work/brand
  codeTheme: adaptive
  sidebarSections: [docs]
  sidebarOpenDepth: 1
  versionProbe: false
  build:
    # The theme's component and token layers are complete without Tailwind.
    # Keeping this false makes the consuming site Hugo-only: no Node/npm step.
    tailwind: false
  productionURL: "https://projectious-work.github.io/brand/"
  # Versioning. The latest release is served from the site root; every release
  # is also archived under /vX.Y.Z/ so links into a specific version keep
  # working after the next release ships. scripts/release.sh maintains this
  # list — add new releases at the top.
  version: "v3.0.0"
  version_menu: "Releases"
  version_menu_pagelinks: false
  archived_version: false
  url_latest_version: "https://projectious-work.github.io/brand/"
  versions:
    - label: "v3.0.0"
      note: latest
      url: "https://projectious-work.github.io/brand/"
    - label: "v2.1.1"
      url: "https://projectious-work.github.io/brand/v2.1.1/"
    - label: "v2.1.0"
      url: "https://projectious-work.github.io/brand/v2.1.0/"
    - label: "v2.0.2"
      url: "https://projectious-work.github.io/brand/v2.0.2/"
    - label: "v2.0.1"
      url: "https://projectious-work.github.io/brand/v2.0.1/"
    - label: "v2.0.0"
      url: "https://projectious-work.github.io/brand/v2.0.0/"
    - label: "v1.0.0"
      url: "https://projectious-work.github.io/brand/v1.0.0/"

menus:
  main:
    - name: Documentation
      pageRef: /docs
      weight: 10

module:
  imports:
    - path: github.com/projectious-work/brand-theme-hugo-vanilla

taxonomies:
  tag: tags
  category: categories
