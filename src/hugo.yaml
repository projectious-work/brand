baseURL: "https://projectious-work.github.io/brand/"
title: projectious.work brand
description: The brand and design system for projectious.work — colour, type, logo, components, and usage terms.
theme: [docsy]
enableRobotsTXT: true
enableGitInfo: true
enableEmoji: true

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        # Without block attributes, markdown such as `{.lead .display-6}`
        # renders as visible literal text instead of applying the classes.
        block: true
        title: true
  highlight:
    noClasses: false
  tableOfContents:
    endLevel: 4

outputs:
  home: [HTML, RSS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

params:
  hugoMinVersion: "0.157.0"
  productionURL: "https://projectious-work.github.io/brand/"
  offlineSearch: true
  offlineSearchSummaryLength: 200
  offlineSearchMaxResults: 25
  # Versioning. The latest release is served from the site root; every release
  # is also archived under /vX.Y.Z/ so links into a specific version keep
  # working after the next release ships. scripts/release.sh maintains this
  # list — add new releases at the top.
  version: "v2.1.1"
  version_menu: "Releases"
  version_menu_pagelinks: false
  archived_version: false
  url_latest_version: "https://projectious-work.github.io/brand/"
  versions:
    - version: "v2.1.1"
      kind: latest
      url: "https://projectious-work.github.io/brand/"
    - version: "v2.1.0"
      url: "https://projectious-work.github.io/brand/v2.1.0/"
    - version: "v2.0.2"
      url: "https://projectious-work.github.io/brand/v2.0.2/"
    - version: "v2.0.1"
      url: "https://projectious-work.github.io/brand/v2.0.1/"
    - version: "v2.0.0"
      url: "https://projectious-work.github.io/brand/v2.0.0/"
    - version: "v1.0.0"
      url: "https://projectious-work.github.io/brand/v1.0.0/"
  ui:
    navbar_logo: true
    navbar_theme: light
    showLightDarkModeMenu: true
    sidebar_menu_compact: true
    sidebar_menu_foldable: true
    sidebar_search_disable: false
    feedback:
      enable: false
  links:
    user:
      - name: GitHub
        url: "https://github.com/projectious-work/brand"
        icon: "fa-brands fa-github"
        desc: Source code and issue tracker
  copyright:
    authors: "Projectious"
    from_year: 2026


module:
  replacements:
    - "github.com/FortAwesome/Font-Awesome -> ../node_modules/@fortawesome/fontawesome-free"
    - "github.com/twbs/bootstrap -> ../node_modules/bootstrap"
  mounts:
    # Declaring any mount for a component replaces Hugo's default mount for
    # that component. The vendor mounts below target `assets/` and `static/`,
    # so both defaults must be restored explicitly — otherwise the project's
    # brand SCSS, logo, and favicons are silently ignored in favour of the
    # theme's own assets.
    - source: assets
      target: assets
    - source: static
      target: static
    # The canonical brand assets stay in brand/ at the repository root (see
    # LICENSE.md); mount the downloadable ones into the site rather than
    # duplicating the files. The Hugo project root is src/, so these reach up
    # one level — Hugo permits parent paths in mount sources.
    - source: ../brand/tokens
      target: static/downloads/tokens
    - source: ../brand/logo
      target: static/downloads/logo
    # The worked examples reference the logo as ../logo/svg/…, which resolves
    # correctly only because both land under static/downloads/. Keep the two
    # mounts as siblings.
    - source: ../brand/examples
      target: static/downloads/examples
    - source: node_modules/bootstrap
      target: assets/vendor/bootstrap
    # jQuery and lunr are vendored rather than pulled from code.jquery.com and
    # unpkg.com, which Docsy hardcodes. Builds and deploys are local, so the
    # site must not depend on third-party CDNs being reachable at page load.
    - source: node_modules/jquery/dist/jquery.min.js
      target: assets/vendor/jquery/jquery.min.js
    - source: node_modules/lunr/lunr.min.js
      target: assets/vendor/lunr/lunr.min.js
    - source: node_modules/@fortawesome/fontawesome-free
      target: assets/vendor/Font-Awesome
    - source: node_modules/@fortawesome/fontawesome-free/webfonts
      target: static/webfonts

taxonomies:
  tag: tags
  category: categories
