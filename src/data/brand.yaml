# Canonical brand values, mirrored from brand/tokens/* and
# brand/html/projectious-brand-system-final.html.
#
# The docs render from this file, so a page can never drift from the value it
# documents. When a token changes, change it here and in assets/scss (the SCSS
# is what actually styles the site) — the two are checked against each other by
# scripts/check-tokens.sh.

# Radix-convention step roles. Only 11 and 12 are text roles.
stepRoles:
  - App bg
  - Subtle bg
  - Elem bg
  - Hover bg
  - Active bg
  - Subtle brd
  - Border
  - Strong brd
  - Solid bg
  - Solid hvr
  - Lo text
  - Hi text

scales:
  midnight:
    name: Midnight
    note: Primary. Structure, text, and the calm end of the system.
    light:
      ["#f8f9fb","#f0f3f8","#e2e9f2","#d3deec","#c3d1e3","#b0c1d6",
       "#96abc6","#7490b2","#1d3352","#162944","#3a5a82","#142438"]
    dark:
      ["#0e1720","#131e2b","#1a2b3e","#20354d","#263f5a","#2e4b68",
       "#3a5c7e","#4d7098","#1d3352","#2b4d78","#8aacc8","#c5daf0"]
  orange:
    name: Orange
    note: Accent. Calls to action, active states, and emphasis. Used sparingly.
    light:
      ["#fef9f7","#fef0ea","#fde0d5","#fccebd","#f8baa5","#f0a48c",
       "#e58a6e","#d86e4e","#E05232","#cc4528","#c04424","#6e2714"]
    dark:
      ["#1c110d","#271610","#3d1e13","#522616","#643019","#7a3c20",
       "#974b28","#b85c32","#E05232","#ea7558","#f09878","#fcddd2"]
  slate:
    name: Slate
    note: Secondary. Supporting text, borders, and neutral surfaces.
    light:
      ["#f9f9fa","#f1f2f4","#e6e8eb","#dadce0","#cdd0d5","#bec2c8",
       "#adb2ba","#9299a4","#546a82","#4a5e74","#5c6f82","#1e2b38"]
    dark:
      ["#111416","#171b1f","#20262c","#283038","#303a43","#3a454f",
       "#47545f","#5a6a78","#546a82","#627a92","#97a8b8","#d5dee8"]

core:
  - name: Primary
    token: --color-primary
    hex: "#1d3352"
    use: Text, headings, primary surfaces
  - name: Primary Light
    token: --color-primary-light
    hex: "#2b4d78"
    use: Hover states, dark-mode primary
  - name: Primary Dark
    token: --color-primary-dark
    hex: "#132440"
    use: Dark backgrounds, navbar, code blocks
  - name: Accent
    token: --color-accent
    hex: "#E05232"
    use: CTAs, highlights, active states
  - name: Accent Light
    token: --color-accent-light
    hex: "#ea7558"
    use: Accent hover on dark, syntax strings
  - name: Accent Dark
    token: --color-accent-dark
    hex: "#b84228"
    use: Accent pressed state
  - name: Accent Solid
    token: --color-accent-solid
    hex: "#cc4528"
    use: Fill for solid controls with white text (4.72:1)
  - name: Secondary
    token: --color-secondary
    hex: "#546a82"
    use: Supporting text, borders

# Semantic colours. Mode-specific by necessity: the light values are tuned for
# dark text on a light tint and measure 2.6-3.7:1 as foregrounds on the dark app
# surface. `onTint` is the foreground to use on the matching tint, where the
# solid value does not clear AA. Ratios are measured against `tint`.
semantic:
  - role: Success
    lightSolid: "#2f7d65"
    lightTint: "#d1ebe0"
    lightOnTint: "#276754"
    lightContrast: "5.28:1"
    darkSolid: "#6cc090"
    darkTint: "#16302a"
    darkContrast: "6.43:1"
    use: A completed, evidenced check
  - role: Warning
    lightSolid: "#8b6508"
    lightTint: "#f5ecd0"
    lightOnTint: "#6f5106"
    lightContrast: "6.23:1"
    darkSolid: "#e0a92a"
    darkTint: "#33280d"
    darkContrast: "6.81:1"
    use: A condition to assess. Gold, never the accent
  - role: Danger
    lightSolid: "#a8261c"
    lightTint: "#fce8e8"
    lightOnTint: "#a8261c"
    lightContrast: "6.03:1"
    darkSolid: "#f08b80"
    darkTint: "#3a1c19"
    darkContrast: "6.40:1"
    use: A failure needing a next action
  - role: Info
    lightSolid: "#3a5a82"
    lightTint: "#dae2ec"
    lightOnTint: "#3a5a82"
    lightContrast: "5.42:1"
    darkSolid: "#8aacc8"
    darkTint: "#1a2b3e"
    darkContrast: "6.04:1"
    use: Neutral context, no judgement

# App surface and text aliases. Every scale step is available on its own; these
# name the handful a consumer reaches for first. Contrast is against the mode's
# own `bg`.
surfaces:
  - token: --color-bg
    light: "#f8f9fb"
    dark: "#0e1720"
    step: midnight 1
    use: Page canvas
  - token: --color-surface
    light: "#ffffff"
    dark: "#131e2b"
    step: white / midnight-dark 2
    use: Cards, panels, elevated surfaces
  - token: --color-text-primary
    light: "#142438"
    dark: "#c5daf0"
    step: midnight 12
    contrast: "14.89:1 / 12.62:1"
    use: Body and heading text
  - token: --color-text-secondary
    light: "#546a82"
    dark: "#97a8b8"
    step: slate 9 / slate-dark 11
    contrast: "5.30:1 / 7.41:1"
    use: Supporting text
  - token: --color-text-muted
    light: "#5c6f82"
    dark: "#97a8b8"
    step: slate 11 / slate-dark 11
    contrast: "4.92:1 / 7.41:1"
    use: Captions and low-emphasis text
  - token: --color-border
    light: "#cdd0d5"
    dark: "#263f5a"
    step: slate 5 / midnight-dark 5
    use: Dividers and component borders

# Breakpoints. Below `sm` is the base, not a breakpoint — see
# docs/foundations/responsive.
breakpoints:
  - name: sm
    value: 640
    use: Large phone, landscape phone
  - name: md
    value: 768
    use: Small tablet — the first two-column layout
  - name: lg
    value: 1024
    use: Tablet landscape, small laptop — sidebars appear
  - name: xl
    value: 1280
    use: Desktop — the 1100px measure is fully margined


type:
