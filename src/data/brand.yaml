    size: 48
    weight: 800
    lh: "1.1"
    family: Plus Jakarta Sans
    sample: Redesigning work
  - style: H1
    size: 36
    weight: 700
    lh: "1.15"
    family: Plus Jakarta Sans
    sample: Agent-first consulting
  - style: H2
    size: 28
    weight: 700
    lh: "1.2"
    family: Plus Jakarta Sans
    sample: Composable infrastructure
  - style: H3
    size: 22
    weight: 600
    lh: "1.25"
    family: Plus Jakarta Sans
    sample: How the system fits together
  - style: H4
    size: 18
    weight: 600
    lh: "1.3"
    family: Plus Jakarta Sans
    sample: Working in the open
  - style: H5
    size: 15
    weight: 600
    lh: "1.35"
    family: Plus Jakarta Sans
    sample: Supporting detail
  - style: Body L
    size: 16
    weight: 400
    lh: "1.65"
    family: Source Sans 3
    sample: Augmenting people's strengths through composable Cloud, Agile, and Agentic AI infrastructure.
  - style: Caption
    size: 12
    weight: 400
    lh: "1.5"
    family: Source Sans 3
    sample: Figure 1 — pipeline stages and their policy gates.
  - style: Overline
    size: 11
    weight: 600
    lh: "1.3"
    family: Source Sans 3
    sample: SECTION LABEL
  - style: Code
    size: 13
    weight: 400
    lh: "1.6"
    family: IBM Plex Mono
    sample: 'createPipeline({ policy: "strict" })'

spacing:
  base: 4
  steps: [4, 8, 12, 16, 24, 32, 48, 64, 96]

radius:
  - name: sm
    value: 3px
    use: Tags, chips, small indicators
  - name: md
    value: 6px
    use: Buttons, inputs, code blocks
  - name: lg
    value: 9px
    use: Cards, panels
  - name: xl
    value: 13px
    use: Large panels, modals
  - name: full
    value: 9999px
    use: Pills, avatars

elevation:
  - name: shadow-0
    value: none
    use: Flat surfaces, default
  - name: shadow-1
    value: 0 1px 3px rgba(0,0,0,0.06)
    use: Subtle lift — cards at rest
  - name: shadow-2
    value: 0 4px 12px rgba(0,0,0,0.08)
    use: Raised — hover, dropdowns
  - name: shadow-3
    value: 0 8px 24px rgba(0,0,0,0.12)
    use: Overlay — modals, popovers

motion:
  durations:
    - name: micro
      value: 100ms
      use: Colour and opacity changes
    - name: standard
      value: 200ms
      use: Most transitions — hover, focus, small moves
    - name: expand
      value: 300ms
      use: Height and width changes, accordions
    - name: page
      value: 400ms
      use: Route and view transitions
  easing:
    - name: ease-out
      value: cubic-bezier(0.33, 1, 0.68, 1)
      use: Entering — elements arriving on screen
    - name: ease-in
      value: cubic-bezier(0.32, 0, 0.67, 0)
      use: Exiting — elements leaving screen

fonts:
  - family: Plus Jakarta Sans
    weights: 400 · 500 · 600 · 700 · 800
    role: Headings, display, buttons, navigation, wordmark
    license: SIL OFL 1.1
  - family: Source Sans 3
    weights: 400 · 500 · 600
    role: Body copy, UI labels, captions
    license: SIL OFL 1.1
  - family: IBM Plex Mono
    weights: 400 · 500
    role: Code, terminal output, data
    license: SIL OFL 1.1

syntax:
  - token: Identifiers
    step: midnight-12
    hex: "#c5daf0"
    contrast: "11.74:1"
  - token: Numbers
    step: orange-11
    hex: "#f09878"
    contrast: "7.58:1"
  - token: Keywords
    step: midnight-11
    hex: "#8aacc8"
    contrast: "7.06:1"
  - token: Operators
    step: slate-11
    hex: "#97a8b8"
    contrast: "6.90:1"
  - token: Strings
    step: orange-light
    hex: "#ea7558"
    contrast: "5.76:1"
  - token: Comments
    step: code-comment
    hex: "#72889d"
    contrast: "4.59:1"

# The terminal palette. A terminal has one surface, it is dark, and everything
# is measured against it — so unlike the three scales this is not a ramp in two
# modes but a fixed sixteen-slot palette plus its chrome.
#
# The bright ramp is the brand: where a hue already exists in the system, the
# bright slot takes that step verbatim. The normal ramp has no brand equivalent
# (the scales define one value per semantic role, not a dim and a bright), so
# each normal slot is that step darkened until it reads a step back while still
# clearing 4.5:1. Magenta and cyan exist in neither half of the brand.
#
# Ratios are measured against `surface`. Everything except ANSI 0 clears 4.5:1;
# the measured floor is 4.95:1.
terminal:
  surface: "#0e1720"
  floor: "4.95:1"
  ansi:
    - slot: 0
      name: black
      normal: "#0e1720"
      normalContrast: "—"
      bright: "#2e4b68"
      brightContrast: "2.00:1"
      source: midnight-dark-1 / midnight-dark-6
      note: Box drawing and rules, not text — deliberately below the floor.
    - slot: 1
      name: red
      normal: "#e55b5b"
      normalContrast: "5.15:1"
      bright: "#f08b80"
      brightContrast: "7.49:1"
      source: bright = danger-dark
      note: Never the accent — an error and the brand must not look alike.
    - slot: 2
      name: green
      normal: "#3f9d74"
      normalContrast: "5.41:1"
      bright: "#6cc090"
      brightContrast: "8.24:1"
      source: bright = success-dark
      note: ""
    - slot: 3
      name: yellow
      normal: "#c08a1e"
      normalContrast: "5.93:1"
      bright: "#e0a92a"
      brightContrast: "8.50:1"
      source: bright = warning-dark
      note: Gold, matching the warning role in the interface.
    - slot: 4
      name: blue
      normal: "#6289b3"
      normalContrast: "4.95:1"
      bright: "#8aacc8"
      brightContrast: "7.59:1"
      source: bright = midnight-dark-11
      note: ""
    - slot: 5
      name: magenta
      normal: "#bd6d96"
      normalContrast: "4.98:1"
      bright: "#d491b4"
      brightContrast: "7.32:1"
      source: terminal-only
      note: The brand defines no magenta; this slot exists only here.
    - slot: 6
      name: cyan
      normal: "#3f97a3"
      normalContrast: "5.31:1"
      bright: "#74c0c9"
      brightContrast: "8.71:1"
      source: terminal-only
      note: The brand defines no cyan; this slot exists only here.
    - slot: 7
      name: white
      normal: "#97a8b8"
      normalContrast: "7.41:1"
      bright: "#c5daf0"
      brightContrast: "12.62:1"
      source: slate-dark-11 / midnight-dark-12
      note: ""
  chrome:
    - role: Background
      hex: "#0e1720"
      contrast: the surface
    - role: Foreground
      hex: "#c5daf0"
      contrast: "12.62:1"
    - role: Cursor
      hex: "#e05232"
      contrast: "4.67:1"
    - role: Cursor text
      hex: "#0e1720"
      contrast: "4.67:1 on the cursor"
    - role: Selection background
      hex: "#20354d"
      contrast: "—"
    - role: Selection text
      hex: "#c5daf0"
      contrast: "8.74:1"
    - role: Dim / comment
      hex: "#72889d"
      contrast: "4.93:1"
    - role: Status bar surface
      hex: "#131e2b"
      contrast: "—"
    - role: Status bar text
      hex: "#c5daf0"
      contrast: "11.74:1"
    - role: Inactive tab and pane label
      hex: "#7b8da3"
      contrast: "4.95:1"
    - role: Active tab fill
      hex: "#e05232"
      contrast: "4.67:1 with #0e1720 text"
    - role: Active pane border
      hex: "#e05232"
      contrast: "4.67:1"
    - role: Inactive pane border
      hex: "#7b8da3"
      contrast: "5.32:1"

# Syntax scopes.
#
# IDEs do not define six token types; the Language Server Protocol defines 22
# semantic token types plus 10 modifiers, and TextMate — the grammar model
# behind VS Code, Sublime and most highlighters — defines 11 root scopes with
# a deep sub-scope tree beneath each.
#
# Hue assignment is set by perceptual distance, not by taste. Keywords and
# operators once measured ΔE2000 5.2 apart — the same colour for reading
# purposes — because both sat in the blue-grey band at the same lightness. Only
# the three neutrals (plain, operators, comments) live in that band now,
# separated by lightness alone; every chromatic role holds its own hue.
#
# A good theme does NOT answer that with 22 colours. It groups scopes into a
# handful of *roles* and lets weight and slant carry the rest, because colour
# stops being a signal once there is too much of it. This maps the two scope
# vocabularies onto ten roles, each an existing brand or terminal value — no
# new colour is introduced.
#
# Ratios are measured against the code surface, midnight-dark-2 (#131e2b).
syntaxScopes:
  surface: "#131e2b"
  floor: "4.59:1"
  roles:
    - role: Plain and variables
      hex: "#c5daf0"
      contrast: "11.74:1"
      step: midnight-dark-12
      lsp: variable · parameter · property · enumMember
      textmate: variable · variable.parameter · variable.other
      chroma: .n .nv .nx .py .vc .vg .vi
      note: The default. Anything the reader does not need to pick out.
    - role: Keywords and modifiers
      hex: "#d491b4"
      contrast: "6.82:1"
      step: terminal magenta (bright)
      lsp: keyword · modifier
      textmate: keyword.control · storage.modifier · storage.type
      chroma: .k .kc .kd .kn .kp .kr .nt .na
      note: Also structural keys — a YAML key is the keyword of its line.
    - role: Types and classes
      hex: "#6cc090"
      contrast: "7.67:1"
      step: terminal green (bright)
      lsp: type · class · struct · interface · enum · typeParameter · namespace
      textmate: entity.name.type · entity.name.class · support.class
      chroma: .kt .nc .nn .ne .bp
      note: Green, not cyan, because types are referenced on nearly every line
        of typed code and the most frequent role should hold the best-separated
        hue — 29.9 ΔE2000 from plain text, against cyan's 17.3.
    - role: Functions and methods
      hex: "#e0a92a"
      contrast: "7.91:1"
      step: terminal yellow (bright)
      lsp: function · method
      textmate: entity.name.function · support.function
      chroma: .nf .fm
      note: Callables read as callable at a glance — the single most useful
        distinction beyond the original six.
    - role: Decorators and macros
      hex: "#74c0c9"
      contrast: "8.11:1"
      step: terminal cyan (bright)
      lsp: macro · decorator · event
      textmate: entity.name.tag · meta.decorator · support.macro
      chroma: .nd .ni .nl .cp .cpf
      note: Cyan sits closer to plain text than green does, which is affordable
        here because decorators are rare. Code that runs at a different time
        from the code around it —
        including C preprocessor directives and Rust attributes, which Chroma
        files under Comment.Preproc but which are macros, not commentary.
    - role: Strings
      hex: "#ea7558"
      contrast: "5.76:1"
      step: orange-dark-10
      lsp: string
      textmate: string.quoted · string.interpolated · string.regexp
      chroma: .s .s1 .s2 .sa .sb .sc .se .sh .si .sr .ss .sx .dl
      note: Interpolation delimiters take the operator colour, so the
        expression inside stays readable as code.
    - role: Numbers and constants
      hex: "#f09878"
      contrast: "7.58:1"
      step: orange-dark-11
      lsp: number · regexp
      textmate: constant.numeric · constant.language · constant.character
      chroma: .m .mb .mf .mh .mi .mo .il .no
      note: Literal values, including true/false/nil.
    - role: Operators and punctuation
      hex: "#97a8b8"
      contrast: "6.90:1"
      step: slate-dark-11
      lsp: operator
      textmate: keyword.operator · punctuation
      chroma: .o .ow .p
      note: Present but recessive — structure you read past, not at.
    - role: Comments
      hex: "#72889d"
      contrast: "4.59:1"
      step: code-comment
      lsp: comment
      textmate: comment.line · comment.block · comment.block.documentation
      chroma: .c .ch .cm .c1 .cs .sd
      note: Italic. The only role with no scale step of its own. Documentation
        comments belong here even though Chroma files them under String.Doc —
        a docstring is documentation, not data.
    - role: Invalid and deprecated
      hex: "#e55b5b"
      contrast: "4.79:1"
      step: terminal red (normal)
      lsp: (modifier) deprecated
      textmate: invalid.illegal · invalid.deprecated
      chroma: .err
      note: Deprecated is struck through as well as coloured — the state does
        not depend on hue.
  modifiers:
    - modifier: declaration · definition
      treatment: Weight 500
      why: Where a name is introduced, distinguished from where it is used.
    - modifier: deprecated
      treatment: Line-through
      why: A state, not a category — it must survive greyscale.
    - modifier: documentation
      treatment: Italic, comment colour
      why: Doc comments are comments; they are not a separate hue.
    - modifier: readonly · static · abstract · async · defaultLibrary
      treatment: No distinct colour
      why: Ten modifiers times ten roles is a hundred combinations. Colour
        cannot carry that, and a theme that tries becomes unreadable.
