<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>projectious.work — Logo System v3</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:#f5f4f2;font-family:'Source Sans 3',sans-serif;color:#1a1a1a;-webkit-font-smoothing:antialiased}
  .w{max-width:1100px;margin:0 auto;padding:40px 24px 80px}
  .sec{margin-top:48px}
  .sec-t{font-family:'Plus Jakarta Sans',sans-serif;font-size:17px;font-weight:700;color:#1d3352;margin-bottom:4px}
  .sec-s{font-size:12px;color:#546a82;margin-bottom:16px}
  .box{background:#fff;border-radius:13px;border:1px solid #e5e3de;padding:22px}
  .ctx{border-radius:9px;padding:18px 14px;display:flex;align-items:center;justify-content:center;min-height:70px}
  .cl{background:#f8f9fb}.cdk{background:#132440}
  .note{font-size:11px;color:#5c6b7a;line-height:1.6;margin-top:10px}
  .rule{padding:10px 14px;background:#f8f9fb;border-radius:6px;margin-top:10px}
  .rule-t{font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;font-weight:600;color:#1d3352;margin-bottom:4px}
  .rule-b{font-size:11px;color:#5c6b7a;line-height:1.6}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
  .label{font-family:'Plus Jakarta Sans',sans-serif;font-size:10px;font-weight:600;color:#546a82;margin-top:6px;text-align:center}
  /* Lockup rendered with HTML+CSS for precise spacing */
  .lockup{display:inline-flex;align-items:center;white-space:nowrap}
  .lockup-icon{flex-shrink:0}
  .lockup-text{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;letter-spacing:-0.4px}
  .lockup-dot{border-radius:50%;flex-shrink:0}
  .lockup-ext{font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;letter-spacing:0.02em}
  .lockup-2line{display:inline-flex;align-items:center;gap:6px}
  .lockup-2line-text{display:flex;flex-direction:column;align-items:flex-end}
  .lockup-2line-top{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;letter-spacing:-0.5px}
  .lockup-2line-bot{display:inline-flex;align-items:center;gap:3px}
  .lockup-stacked{display:inline-flex;flex-direction:column;align-items:center;gap:4px}
  .lockup-stacked-bot{display:flex;flex-direction:column;align-items:center;gap:2px}
  .lockup-stacked-dotline{display:inline-flex;align-items:center;gap:2px}
</style>
</head>
<body>
<div class="w">
<div style="text-align:center;margin-bottom:40px">
  <h1 style="font-family:'Plus Jakarta Sans',sans-serif;font-size:30px;font-weight:800;color:#1d3352;letter-spacing:-0.5px;margin-bottom:6px">projectious.work</h1>
  <p style="font-size:16px;color:#546a82;font-weight:500">Logo system v3 — spacing fixed</p>
  <p style="font-size:12px;color:#6b6b6b;margin-top:4px">All lockups use HTML/CSS for precise natural spacing. SVG only for the icon.</p>
</div>
<div id="c"></div>
</div>

<script>
const P="#1d3352",PL="#2b4d78",PD="#132440",A="#E05232",AT="#c04424",AL="#ea7558",S="#546a82";
const HF="'Plus Jakarta Sans',sans-serif",BF="'Source Sans 3',sans-serif",MF="'IBM Plex Mono',monospace";

function iconSvg(size,dk){
  const s=40;
  const fg=dk?'#6b8db2':P;
  const bg=dk?PD:'#fff';
  return `<svg viewBox="0 0 40 40" width="${size}" height="${size}" style="display:block">
    <path d="M${s*.5},${s*.08}C${s*.74},${s*.08} ${s*.9},${s*.3} ${s*.86},${s*.56}C${s*.82},${s*.76} ${s*.64},${s*.9} ${s*.46},${s*.9}C${s*.28},${s*.9} ${s*.12},${s*.76} ${s*.14},${s*.5}C${s*.16},${s*.26} ${s*.3},${s*.08} ${s*.5},${s*.08}Z" fill="${fg}"/>
    <path d="M${s*.26},${s*.74}C${s*.24},${s*.5} ${s*.34},${s*.26} ${s*.52},${s*.2}C${s*.68},${s*.16} ${s*.78},${s*.3} ${s*.8},${s*.48}L${s*.78},${s*.62}C${s*.68},${s*.78} ${s*.42},${s*.82} ${s*.3},${s*.76}Z" fill="${bg}" opacity="0.85"/>
    <path d="M${s*.32},${s*.66}C${s*.3},${s*.48} ${s*.4},${s*.26} ${s*.54},${s*.26}C${s*.66},${s*.28} ${s*.74},${s*.4} ${s*.74},${s*.52}C${s*.72},${s*.66} ${s*.56},${s*.74} ${s*.38},${s*.72}Z" fill="${fg}" opacity="0.85"/>
    <path d="M${s*.36},${s*.62}C${s*.34},${s*.46} ${s*.44},${s*.3} ${s*.56},${s*.32}C${s*.64},${s*.34} ${s*.68},${s*.44} ${s*.66},${s*.56}C${s*.64},${s*.64} ${s*.5},${s*.68} ${s*.38},${s*.64}Z" fill="${bg}" opacity="0.8"/>
    <path d="M${s*.4},${s*.58}C${s*.4},${s*.46} ${s*.46},${s*.36} ${s*.54},${s*.38}C${s*.6},${s*.4} ${s*.62},${s*.48} ${s*.58},${s*.54}C${s*.54},${s*.58} ${s*.44},${s*.6} ${s*.4},${s*.58}Z" fill="${A}"/>
  </svg>`;
}

function iconMonoSvg(size,fg,il){
  const s=40;
  return `<svg viewBox="0 0 40 40" width="${size}" height="${size}" style="display:block">
    <path d="M${s*.5},${s*.08}C${s*.74},${s*.08} ${s*.9},${s*.3} ${s*.86},${s*.56}C${s*.82},${s*.76} ${s*.64},${s*.9} ${s*.46},${s*.9}C${s*.28},${s*.9} ${s*.12},${s*.76} ${s*.14},${s*.5}C${s*.16},${s*.26} ${s*.3},${s*.08} ${s*.5},${s*.08}Z" fill="${fg}"/>
    <path d="M${s*.26},${s*.74}C${s*.24},${s*.5} ${s*.34},${s*.26} ${s*.52},${s*.2}C${s*.68},${s*.16} ${s*.78},${s*.3} ${s*.8},${s*.48}L${s*.78},${s*.62}C${s*.68},${s*.78} ${s*.42},${s*.82} ${s*.3},${s*.76}Z" fill="${il}" opacity="0.85"/>
    <path d="M${s*.32},${s*.66}C${s*.3},${s*.48} ${s*.4},${s*.26} ${s*.54},${s*.26}C${s*.66},${s*.28} ${s*.74},${s*.4} ${s*.74},${s*.52}C${s*.72},${s*.66} ${s*.56},${s*.74} ${s*.38},${s*.72}Z" fill="${fg}" opacity="0.85"/>
    <path d="M${s*.36},${s*.62}C${s*.34},${s*.46} ${s*.44},${s*.3} ${s*.56},${s*.32}C${s*.64},${s*.34} ${s*.68},${s*.44} ${s*.66},${s*.56}C${s*.64},${s*.64} ${s*.5},${s*.68} ${s*.38},${s*.64}Z" fill="${il}" opacity="0.8"/>
    <path d="M${s*.4},${s*.58}C${s*.4},${s*.46} ${s*.46},${s*.36} ${s*.54},${s*.38}C${s*.6},${s*.4} ${s*.62},${s*.48} ${s*.58},${s*.54}C${s*.54},${s*.58} ${s*.44},${s*.6} ${s*.4},${s*.58}Z" fill="${fg}"/>
  </svg>`;
}

function dot(size,color){return `<div class="lockup-dot" style="width:${size}px;height:${size}px;background:${color}"></div>`;}

// Lockup builders using HTML/CSS — browser handles all text spacing
function mkTwoLine(dk){
  const tc=dk?'#fff':P;const dc=dk?'#8aacc8':'#7490b2';
  return `<div class="lockup-2line">
    <div class="lockup-icon">${iconSvg(42,dk)}</div>
    <div class="lockup-2line-text">
      <div class="lockup-2line-top" style="font-size:21px;color:${tc}">projectious</div>
      <div class="lockup-2line-bot">
        ${dot(7,dc)}
        <span class="lockup-ext" style="font-size:12.5px;color:${AT}">work</span>
      </div>
    </div>
  </div>`;
}

function mkOneLine(dk){
  const tc=dk?'#fff':P;const dc=dk?'#8aacc8':'#7490b2';
  return `<div class="lockup" style="gap:5px">
    <div class="lockup-icon">${iconSvg(26,dk)}</div>
    <span class="lockup-text" style="font-size:17px;color:${tc}">projectious</span>
    ${dot(7,dc)}
    <span class="lockup-text" style="font-size:17px;color:${AT}">work</span>
  </div>`;
}

function mkDotReplace(dk){
  const tc=dk?'#fff':P;
  return `<div class="lockup" style="gap:0">
    <span class="lockup-text" style="font-size:18px;color:${tc}">projectious</span>
    <div class="lockup-icon" style="margin:0 1px">${iconSvg(16,dk)}</div>
    <span class="lockup-text" style="font-size:18px;color:${AT}">work</span>
  </div>`;
}

function mkStacked(dk){
  const tc=dk?'#fff':P;const dc=dk?'#8aacc8':'#7490b2';
  return `<div class="lockup-stacked">
    <div class="lockup-icon">${iconSvg(44,dk)}</div>
    <div class="lockup-stacked-bot">
      <span class="lockup-text" style="font-size:14px;color:${tc}">projectious</span>
      <div class="lockup-stacked-dotline">
        ${dot(6,dc)}
        <span class="lockup-ext" style="font-size:10px;color:${AT}">work</span>
      </div>
    </div>
  </div>`;
}

function mkProdLine(ext,dk){
  const tc=dk?'#fff':P;const dc=dk?'#8aacc8':'#7490b2';
  return `<div class="lockup-2line" style="gap:5px">
    <div class="lockup-icon">${iconSvg(36,dk)}</div>
    <div class="lockup-2line-text">
      <div class="lockup-2line-top" style="font-size:18px;color:${tc}">projectious</div>
      <div class="lockup-2line-bot" style="gap:2px">
        ${dot(6,dc)}
        <span class="lockup-ext" style="font-size:11px;color:${AT}">${ext}</span>
      </div>
    </div>
  </div>`;
}

// ── RENDER ──
const c=document.getElementById('c');
function addSec(t,s,html){
  c.insertAdjacentHTML('beforeend',`<div class="sec"><div class="sec-t">${t}</div><div class="sec-s">${s}</div></div>`);
  const b=document.createElement('div');b.className='box';b.innerHTML=html;c.appendChild(b);
}

// S1: Four lockups
let s1='<div class="grid2">';
[
  {nm:"Primary (two-line)",fn:mkTwoLine,use:"Default. Headers, slides, cards."},
  {nm:"Compact (one-line)",fn:mkOneLine,use:"Navbars, footers, signatures."},
  {nm:"Dot-replace (inline)",fn:mkDotReplace,use:"Documents, inline, CLI."},
  {nm:"Stacked (portrait)",fn:mkStacked,use:"App icons, avatars, slide corners."},
].forEach(l=>{
  s1+=`<div><div style="font-family:${HF};font-size:12px;font-weight:600;color:${P};margin-bottom:8px">${l.nm}</div>
    <div style="display:flex;gap:8px;margin-bottom:4px">
      <div class="ctx cl" style="flex:1">${l.fn(false)}</div>
      <div class="ctx cdk" style="flex:1">${l.fn(true)}</div>
    </div>
    <div style="font-size:10px;color:#5c6b7a">${l.use}</div></div>`;
});
s1+='</div>';
addSec("1. The four lockups","All spacing handled by CSS flex — natural text flow guaranteed",s1);

// S2: Icon standalone
addSec("2. Icon standalone","Light and dark",`
  <div style="display:flex;justify-content:center;gap:20px">
    <div style="text-align:center"><div class="ctx cl" style="width:80px;height:80px">${iconSvg(52,false)}</div><div class="label">Light</div></div>
    <div style="text-align:center"><div class="ctx cdk" style="width:80px;height:80px">${iconSvg(52,true)}</div><div class="label">Dark</div></div>
  </div><div class="note">Use standalone only when wordmark is established nearby.</div>`);

// S3: Monochrome
let s3='<div class="grid4">';
[
  {fg:P,il:'#fff',bg:'#f8f9fb',l:"Midnight"},
  {fg:'#000',il:'#fff',bg:'#f8f9fb',l:"Black"},
  {fg:'#fff',il:S,bg:P,l:"White reversed"},
  {fg:'#9299a4',il:'#fff',bg:'#f8f9fb',l:"Gray (print)"},
].forEach(m=>{
  s3+=`<div style="text-align:center"><div class="ctx" style="background:${m.bg};padding:14px">${iconMonoSvg(44,m.fg,m.il)}</div><div class="label">${m.l}</div></div>`;
});
s3+='</div><div class="note">White reversed uses slate inner lines. All petal structure visible in every variant.</div>';
addSec("3. Monochrome","Single color for print, fax, embossing",s3);

// S4: Min size
let s4='<div class="grid4">';
[16,24,32,48].forEach(px=>{
  s4+=`<div style="text-align:center"><div class="ctx cl" style="padding:10px">${iconSvg(px,false)}</div><div class="label">${px}px</div></div>`;
});
s4+=`</div><div class="rule"><div class="rule-t">Minimum sizes</div><div class="rule-b"><strong>Icon:</strong> 24px (16px favicon only). <strong>Two-line:</strong> 120px. <strong>One-line:</strong> 140px. <strong>Dot-replace:</strong> 160px. <strong>Stacked:</strong> 60px.</div></div>`;
addSec("4. Minimum size","Smallest legible size per variant",s4);

// S5: Clear space — FIX: using HTML lockup, no SVG spacing issues
addSec("5. Clear space","1× icon height on all sides",`
  <div style="display:flex;justify-content:center">
    <div style="position:relative;padding:42px;background:#f8f9fb;border-radius:9px;display:inline-block">
      <div style="position:absolute;inset:0;border:2px dashed #c3d1e3;border-radius:9px"></div>
      <div style="position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:9px;color:#96abc6">1× icon height</div>
      ${mkTwoLine(false)}
    </div>
  </div>
  <div class="rule"><div class="rule-t">Exclusion zone</div><div class="rule-b">Minimum clear space = 1× icon height on all sides.</div></div>`);

// S6: Color-on-color
let s6='<div class="grid3">';
[
  {bg:A,l:"On accent (ringed)",dk:true,ring:true},
  {bg:'#f0f3f8',l:"On midnight-2",dk:false},
  {bg:'#e6e8eb',l:"On slate-3",dk:false},
  {bg:P,l:"On midnight",dk:true},
  {bg:'#1a2b3e',l:"On midnight-3",dk:true},
  {bg:'#f5f4f2',l:"On page bg",dk:false},
].forEach(m=>{
  const iconHtml = m.ring 
    ? `<div style="border-radius:50%;border:3px solid #fff;padding:2px;display:inline-flex">${iconSvg(36,true)}</div>`
    : iconSvg(36,m.dk);
  s6+=`<div style="text-align:center"><div class="ctx" style="background:${m.bg};padding:12px">${iconHtml}</div><div class="label">${m.l}</div></div>`;
});
s6+=`</div><div class="rule"><div class="rule-t">Rules</div><div class="rule-b">
<strong>On accent:</strong> White ring border. <strong>On photos:</strong> Semi-transparent midnight backing.<br>
Lighter than slate-5 → light icon. Darker → dark icon.</div></div>`;
addSec("6. Color-on-color","White ring on accent, backing on photos",s6);

// S7: Favicons
let s7='<div class="grid4">';
[{px:16,r:2},{px:32,r:4},{px:48,r:8},{px:80,r:16}].forEach(m=>{
  const pd=Math.max(2,Math.round(m.px*.12));
  s7+=`<div style="text-align:center"><div style="background:${P};border-radius:${m.r}px;width:${m.px}px;height:${m.px}px;padding:${pd}px;margin:4px auto;display:flex;align-items:center;justify-content:center">${iconSvg(m.px-pd*2,true)}</div><div class="label">${m.px===80?'180px (scaled)':m.px+'px'}</div></div>`;
});
s7+=`</div><div class="rule"><div class="rule-t">Spec</div><div class="rule-b">Icon-only on midnight. Radius: 16→2, 32→4, 48→8, 180→36. Padding: 12%.</div></div>`;
addSec("7. Favicon / app icons","16, 32, 48, 180px",s7);

// S8: Product line — FIX: HTML/CSS, same dot style, natural flow
let s8='<div class="grid3">';
["work","guard","flow"].forEach(ext=>{
  s8+=`<div style="text-align:center"><div class="ctx cl" style="padding:14px">${mkProdLine(ext,false)}</div><div class="label">projectious.${ext}</div></div>`;
});
s8+='</div><div style="margin-top:10px"><div class="grid3">';
["work","guard","flow"].forEach(ext=>{
  s8+=`<div style="text-align:center"><div class="ctx cdk" style="padding:14px">${mkProdLine(ext,true)}</div></div>`;
});
s8+=`</div></div>
<div class="rule"><div class="rule-t">Product line rules</div><div class="rule-b">
"projectious" + icon + dot stay constant. Extension word is the only variable, always accent orange. All spacing is CSS flex — dot and word flow naturally regardless of word width. Same slate dot (6px) as in all other lockups.
</div></div>`;
addSec("8. Product line","Natural dot+word flow via CSS flex, consistent dot style",s8);

// S9: Watermark
addSec("9. Watermark","8–15% opacity for backgrounds",`
  <div style="display:flex;justify-content:center;gap:20px">
    <div style="text-align:center"><div class="ctx" style="background:#fff;padding:20px;width:120px;height:120px"><div style="opacity:0.1">${iconSvg(80,false)}</div></div><div class="label">On light</div></div>
    <div style="text-align:center"><div class="ctx" style="background:${PD};padding:20px;width:120px;height:120px"><div style="opacity:0.08">${iconSvg(80,true)}</div></div><div class="label">On dark</div></div>
  </div><div class="note">Uniform wash. No accent color in watermark mode.</div>`);

// S10: File delivery
addSec("10. File delivery","SVG, PNG @1x 2x 3x, ICO, PDF",`
  <div class="rule" style="margin:0"><div class="rule-t">Formats</div><div class="rule-b">
  <div style="display:grid;grid-template-columns:auto 1fr;gap:3px 16px;font-family:${MF};font-size:11px;line-height:1.8">
    <span style="color:${AT}">SVG</span><span>Vector source. Primary for web + print.</span>
    <span style="color:${AT}">PNG @1x</span><span>Native (16/32/48/64/128/256/512).</span>
    <span style="color:${AT}">PNG @2x</span><span>Retina. Required for web.</span>
    <span style="color:${AT}">PNG @3x</span><span>Super-retina. Mobile.</span>
    <span style="color:${AT}">ICO</span><span>Multi-res favicon (16+32+48).</span>
    <span style="color:${AT}">PDF</span><span>Vector for print.</span>
    <span style="color:${AT}">apple-touch</span><span>180×180 PNG.</span>
  </div>
  <div style="margin-top:8px;font-size:11px;color:#5c6b7a">~80 files: <span style="font-family:${MF};font-size:10px">/logo/{variant}/{mode}/{format}/</span></div>
  </div></div>`);

</script>
</body>
</html>
