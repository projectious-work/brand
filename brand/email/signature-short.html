<!-- ==========================================================================
     projectious.work — email signature, short form
     ==========================================================================
     For replies and internal mail, where the full block repeated down a thread
     becomes noise. Use the full signature (signature.html) on first contact and
     on any message that leaves the organisation, since the legal details are
     required there.

     Same construction rules: table layout, inline styles, web-safe stack, one
     white declaration per level (table, row, cell), and one
     vertical accent rule, no horizontal rules.
     ========================================================================== -->

<table cellpadding="0" cellspacing="0" border="0" role="presentation" bgcolor="#ffffff"
       style="border-collapse:collapse;max-width:520px;background:#ffffff;background-color:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:13px;line-height:1.5;color:#142438">
  <tr bgcolor="#ffffff" style="background-color:#ffffff">
    <td bgcolor="#ffffff" style="background:#ffffff;background-color:#ffffff;border-left:3px solid #E05232;padding:2px 0 2px 14px">
      <div style="font-size:14px;font-weight:700;color:#1d3352;letter-spacing:-0.2px">[FULL NAME]</div>
      <div style="font-size:12px;color:#546a82">[JOB TITLE] · [COMPANY]</div>
      <div style="padding-top:5px">
        <a href="mailto:[EMAIL]" style="font-size:12px;color:#3a5a82;text-decoration:none">[EMAIL]</a>
        <span style="font-size:12px;color:#546a82" aria-hidden="true">&nbsp;·&nbsp;</span>
        <a href="https://projectious.work" style="font-size:12px;color:#3a5a82;text-decoration:none">projectious.work</a>
      </div>
    </td>
  </tr>
</table>
