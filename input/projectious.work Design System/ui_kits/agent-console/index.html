<!doctype html>
<!-- @dsCard group="UI Kit — Agent Console" name="UI kit · Agent console" subtitle="Sidebar · pipelines list · run detail with logs" viewport="1280x800" -->
<html lang="en" data-a11y="auto" data-focus="strong">
<head>
  <meta charset="utf-8">
  <title>Agent console — projectious.work</title>
  <link rel="icon" href="../../assets/logo/favicon-32.png">
  <link rel="stylesheet" href="../../styles.css">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    body { font-family: var(--font-body); color: var(--color-text-primary); overflow: hidden; }
    #root { height: 100vh; display: flex; flex-direction: column; }
    /* Same labelled three-way switch every other card carries. The topbar icon
       cycles the same state, but an icon alone is not discoverable. */
    .appearance { position: fixed; right: 16px; bottom: 16px; z-index: 50; display: flex; gap: 4px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 9999px;
      padding: 4px; box-shadow: var(--shadow-2); }
    .appearance button { font-family: var(--font-body); font-size: 12px; line-height: 1; padding: 7px 13px;
      border: 0; border-radius: 9999px; background: transparent; color: var(--fg-2); cursor: pointer; }
    .appearance button[aria-pressed="true"] { background: var(--surface-2); color: var(--fg-1); font-weight: 600; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
</head>
<body>
  <div id="root"></div>
  <div class="appearance" role="group" aria-label="Appearance">
    <button data-appearance="light">Light</button>
    <button data-appearance="navy">Navy dark</button>
    <button data-appearance="dark">Deep dark</button>
  </div>
  <script>
    const NS = window.ProjectiousWorkDesignSystem_019de8;
    const { Sidebar, Topbar, PipelineList, RunDetail, StatusBar, THEMES } = NS;
    const h = React.createElement;

    const PIPELINES = [
      { id: 1, name: 'validate-deploy', tag: 'platform/validate-deploy', status: 'running', lastRun: '2m ago', owner: 'Jan S.', runs: 412 },
      { id: 2, name: 'audit-nightly', tag: 'compliance/audit-nightly', status: 'healthy', lastRun: '5h ago', owner: 'Maya R.', runs: 188 },
      { id: 3, name: 'cost-rebalance', tag: 'finops/cost-rebalance', status: 'warning', lastRun: '1d ago', owner: 'Ahmed K.', runs: 64 },
      { id: 4, name: 'spec-from-issue', tag: 'agentic/spec-from-issue', status: 'healthy', lastRun: '12h ago', owner: 'Lina B.', runs: 27 },
      { id: 5, name: 'k8s-rollout', tag: 'platform/k8s-rollout', status: 'failed', lastRun: 'yesterday', owner: 'Jan S.', runs: 301 }
    ];

    function App() {
      const [active, setActive] = React.useState('pipelines');
      const [selectedId, setSelectedId] = React.useState(1);
      const [mode, setMode] = React.useState(() => {
        try { var v = localStorage.getItem('pw-theme-mode'); return (v === 'dark' && !localStorage.getItem('pw-theme-explicit')) ? 'navy' : (v || 'light'); } catch (e) { return 'light'; }
      });
      const theme = THEMES[mode] || THEMES.light;
      const selected = PIPELINES.find(p => p.id === selectedId);
      React.useEffect(() => {
        try { localStorage.setItem('pw-theme-mode', mode); } catch (e) {}
        document.body.style.background = theme.appBg;
        // Keep the token layer in step, so the switch chrome itself re-themes.
        var root = document.documentElement;
        root.setAttribute('data-theme', mode === 'light' ? 'light' : 'dark');
        document.body.setAttribute('data-theme', mode === 'light' ? 'light' : 'dark');
        if (mode === 'dark') { root.setAttribute('data-surface', 'deep'); document.body.setAttribute('data-surface', 'deep'); }
        else { root.removeAttribute('data-surface'); document.body.removeAttribute('data-surface'); }
        document.querySelectorAll('[data-appearance]').forEach(function (b) {
          b.setAttribute('aria-pressed', b.getAttribute('data-appearance') === mode ? 'true' : 'false');
        });
      }, [mode]);
      const toggleMode = () => setMode(m => m === 'light' ? 'navy' : m === 'navy' ? 'dark' : 'light');
      React.useEffect(() => {
        function onPick(e) {
          var b = e.target.closest('[data-appearance]');
          if (b) setMode(b.getAttribute('data-appearance'));
        }
        document.addEventListener('click', onPick);
        return () => document.removeEventListener('click', onPick);
      }, []);
      return h('div', { style: { display: 'flex', flex: 1, minHeight: 0, background: theme.appBg } },
        h(Sidebar, { active, onNav: setActive, theme }),
        h('div', { style: { flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0 } },
          h(Topbar, { title: 'Pipelines', theme, mode, onToggleMode: toggleMode }),
          h('div', { style: { flex: 1, overflow: 'auto', padding: 24, background: theme.appBg } },
            h('div', { style: { display: 'grid', gridTemplateColumns: '1.3fr 1fr', gap: 18 } },
              h(PipelineList, { rows: PIPELINES, selectedId, onSelect: setSelectedId, theme }),
              h(RunDetail, { pipeline: selected, theme })
            )
          ),
          h(StatusBar, { theme })
        )
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(h(App));
  </script>
</body>
</html>
