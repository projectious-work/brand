<!doctype html>
<!-- @dsCard group="UI Kit — Marketing Site" name="UI kit · Marketing site" subtitle="Landing page — hero, pillars, code, convictions, CTA, footer" viewport="1280x800" -->
<html lang="en" data-a11y="auto" data-focus="strong" data-link-underline="on">
<head>
  <meta charset="utf-8">
  <title>projectious.work — Redesigning work</title>
  <link rel="icon" href="../../assets/logo/favicon-32.png">
  <link rel="stylesheet" href="../../styles.css">
  <style>
    html, body { margin: 0; padding: 0; background: var(--color-bg); }
    body { font-family: var(--font-body); color: var(--color-text-primary); }
    a { color: var(--midnight-11); }
    a:hover { color: var(--midnight-11); opacity: 0.78; }
    /* Appearance switch — the same three the design system supports. */
    .appearance { position: fixed; right: 16px; bottom: 16px; z-index: 50; display: flex; gap: 6px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 9999px; padding: 5px; box-shadow: var(--shadow-2); }
    .appearance button { font-family: var(--font-body); font-size: 12px; line-height: 1; padding: 7px 13px;
      border: 0; border-radius: 9999px; background: transparent; color: var(--fg-2); cursor: pointer; }
    .appearance button[aria-pressed="true"] { background: var(--surface-2); color: var(--fg-1); font-weight: 600; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="appearance" role="group" aria-label="Appearance">
    <button data-appearance="light">Light</button>
    <button data-appearance="navy">Navy dark</button>
    <button data-appearance="deep">Deep dark</button>
  </div>
  <div id="root"></div>
  <script>
    const { Header, Hero, Pillars, CodeShowcase, Convictions, CTA, Footer } = window.ProjectiousWorkDesignSystem_019de8;
    const h = React.createElement;
    ReactDOM.createRoot(document.getElementById('root')).render(
      h(React.Fragment, null, h(Header), h('main', { id: 'main' }, h(Hero), h(Pillars), h(CodeShowcase), h(Convictions), h(CTA)), h(Footer))
    );
  </script>
  <script>
    (function () {
      var MODES = { light: ['light', null], navy: ['dark', null], deep: ['dark', 'deep'] };
      var root = document.documentElement;
      function apply(id) {
        var m = MODES[id] || MODES.light;
        root.setAttribute('data-theme', m[0]);
        if (m[1]) root.setAttribute('data-surface', m[1]); else root.removeAttribute('data-surface');
        document.body.setAttribute('data-theme', m[0]);
        if (m[1]) document.body.setAttribute('data-surface', m[1]); else document.body.removeAttribute('data-surface');
        document.querySelectorAll('[data-appearance]').forEach(function (b) {
          b.setAttribute('aria-pressed', b.getAttribute('data-appearance') === id ? 'true' : 'false');
        });
        try { localStorage.setItem('pw-site-appearance', id); } catch (e) {}
      }
      document.querySelectorAll('[data-appearance]').forEach(function (b) {
        b.addEventListener('click', function () { apply(b.getAttribute('data-appearance')); });
      });
      var saved = 'light';
      try { saved = localStorage.getItem('pw-site-appearance') || 'light'; } catch (e) {}
      apply(saved);
    })();
  </script>
</body>
</html>
