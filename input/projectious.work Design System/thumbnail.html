<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;padding:0;width:1280px;height:854px;overflow:hidden}.wrap{display:grid;grid-template-columns:1fr 320px;width:1280px;height:854px}
.main{background:#1d3352;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px}
.name{font-family:var(--font-heading);font-weight:800;font-size:104px;letter-spacing:-3px;color:#fff;line-height:1;white-space:nowrap}
.name .dot{color:#E05232}
.strip{display:grid;grid-template-rows:repeat(4,1fr);height:854px}</style></head><body>
<div class="wrap">
  <div class="main">
    <img src="assets/logo/icon-dark.svg" width="200" height="200" alt="">
    <div class="name">projectious<span class="dot">·</span>work</div>
  </div>
  <div class="strip">
    <div style="background:#6cc090"></div>
    <div style="background:#e0a92a"></div>
    <div style="background:#E05232"></div>
    <div style="background:#a8261c"></div>
  </div>
</div>
</body></html>
