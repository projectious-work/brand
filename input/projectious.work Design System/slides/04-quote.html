<!doctype html>
<!-- @dsCard group="Slides" name="Slide · Quote" subtitle="Midnight background — customer voice" viewport="1280x720" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:#1d3352;width:1280px;height:720px;overflow:hidden;font-family:var(--font-body);color:#c5daf0}
  .slide{width:1280px;height:720px;padding:120px 140px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;position:relative}
  .quote{font-family:var(--font-heading);font-weight:700;font-size:64px;line-height:1.2;letter-spacing:-1px;color:#fff;margin:0;max-width:1100px}

  .attr{margin-top:48px;font-family:var(--font-body);font-size:16px;color:#97a8b8;display:flex;align-items:center;gap:14px}
  .attr .who{color:#fff;font-weight:600}
  .footer{position:absolute;bottom:48px;left:140px;right:140px;display:flex;justify-content:space-between;font-size:12px;color:#5a6a78;font-family:var(--font-code)}
</style></head><body>
<div class="slide">
  <div class="quote">We didn't buy a tool. We bought a posture — quality is now continuous, not quarterly.</div>
  <div class="attr"><span class="who">Lina B.</span><span>·</span><span>VP Platform, mid-cap European e-com</span></div>
  <div class="footer"><div>projectious·work · Customer voice</div><div>04 / 06</div></div>
</div>
