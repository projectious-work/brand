<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slides — projectious.work</title>
<link rel="icon" href="../assets/logo/favicon-32.png">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#f8f9fb;font-family:var(--font-body);color:var(--fg-1)}
  .wrap{padding:48px 32px;max-width:1320px;margin:0 auto}
  h1{font-family:var(--font-heading);font-weight:700;font-size:28px;color:#1d3352;letter-spacing:-0.4px;margin:0 0 4px}
  .sub{color:#5c6f82;font-size:14px;margin-bottom:36px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
  .item{background:#fff;border:1px solid #cdd0d5;border-radius:9px;overflow:hidden}
  .item .frame{position:relative;width:100%;padding-bottom:56.25%;background:#0e1720}
  .item iframe{position:absolute;inset:0;width:1280px;height:720px;border:0;transform:scale(0.5);transform-origin:top left}
  .item .label{padding:14px 18px;font-family:var(--font-heading);font-weight:600;font-size:14px;color:#1d3352;display:flex;justify-content:space-between;align-items:center}
  .item .label a{font-family:var(--font-body);font-size:12px;color:#c04424;text-decoration:none}
  /* iframe wrapper to clip the 0.5 scaled 1280px=640px */
  .clip{position:absolute;inset:0;overflow:hidden}
</style>
</head>
<body>
  <div class="wrap">
    <h1>Slide templates</h1>
    <div class="sub">Six 1280×720 slide types. Open any standalone to copy as a starting point.</div>
    <div class="grid">
      <div class="item"><div class="frame"><div class="clip"><iframe src="01-title.html"></iframe></div></div><div class="label">01 · Title (dark, hero)<a href="01-title.html">Open ↗</a></div></div>
      <div class="item"><div class="frame"><div class="clip"><iframe src="02-section-statement.html"></iframe></div></div><div class="label">02 · Section statement<a href="02-section-statement.html">Open ↗</a></div></div>
      <div class="item"><div class="frame"><div class="clip"><iframe src="03-three-up.html"></iframe></div></div><div class="label">03 · Three-up<a href="03-three-up.html">Open ↗</a></div></div>
      <div class="item"><div class="frame"><div class="clip"><iframe src="04-quote.html"></iframe></div></div><div class="label">04 · Quote (midnight)<a href="04-quote.html">Open ↗</a></div></div>
      <div class="item"><div class="frame"><div class="clip"><iframe src="05-code-showcase.html"></iframe></div></div><div class="label">05 · Code showcase<a href="05-code-showcase.html">Open ↗</a></div></div>
      <div class="item"><div class="frame"><div class="clip"><iframe src="06-cta-closer.html"></iframe></div></div><div class="label">06 · CTA closer<a href="06-cta-closer.html">Open ↗</a></div></div>
    </div>
  </div>
</body>
</html>
