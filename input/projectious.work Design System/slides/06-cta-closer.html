<!doctype html>
<!-- @dsCard group="Slides" name="Slide · CTA closer" subtitle="Dark CTA with primary + ghost button" viewport="1280x720" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:#132440;width:1280px;height:720px;overflow:hidden;font-family:var(--font-body);color:#c5daf0}
  .slide{width:1280px;height:720px;padding:120px 96px;box-sizing:border-box;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
  .glow{position:absolute;top:-260px;right:-260px;width:680px;height:680px;background:radial-gradient(circle,rgba(224,82,50,0.14) 0%,rgba(224,82,50,0) 65%);pointer-events:none}
  .eyebrow{font-size:13px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#ea7558;margin-bottom:24px}
  h2{font-family:var(--font-heading);font-weight:800;font-size:80px;line-height:1.05;letter-spacing:-1.5px;color:#fff;margin:0;max-width:1000px}
  .row{display:flex;gap:14px;margin-top:48px;align-items:center}
  .btn{font-family:var(--font-heading);font-weight:500;font-size:18px;padding:16px 32px;border-radius:6px;border:0;cursor:pointer}
  .btn.primary{background:#E05232;color:#fff}
  .btn.ghost{background:transparent;color:#c5daf0;border:1.5px solid rgba(255,255,255,0.18)}
  .meta{position:absolute;bottom:48px;left:96px;right:96px;display:flex;justify-content:space-between;font-size:13px;color:#97a8b8}
  .meta .r{font-family:var(--font-code);color:#5a6a78}
  .lockup{display:flex;align-items:center;gap:10px;font-family:var(--font-heading);font-weight:700;font-size:14px;color:#fff}
  .lockup .dot{color:#7490b2}.lockup .work{color:#E05232}
</style></head><body>
<div class="slide">
  <div class="glow"></div>
  <div class="eyebrow">Next steps</div>
  <h2>Let's redesign how you work.</h2>
  <div class="row">
    <button class="btn primary">Book a 30-minute intro</button>
    <button class="btn ghost">hello@projectious.work</button>
  </div>
  <div class="meta">
    <div class="lockup"><img src="../assets/logo/icon-dark.svg" width="20" height="20">projectious<span class="dot">·</span><span class="work">work</span></div>
    <div class="r">06 / 06</div>
  </div>
</div>
</body></html>
