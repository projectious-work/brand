<!doctype html>
<!-- @dsCard group="Brand" name="Components · Buttons" subtitle="Primary · Accent · Outline · Ghost · Danger · sizes" viewport="700x140" --><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"></head><body data-theme="light" data-mode="light">
<div class="col" style="gap:8px">
  <div class="row" style="gap:8px;flex-wrap:wrap">
    <button style="font-family:var(--font-heading);font-weight:500;font-size:13px;padding:8px 18px;border:0;border-radius:6px;color:var(--fixed-control-text);background:var(--midnight-9)">Primary</button>
    <button style="font-family:var(--font-heading);font-weight:500;font-size:13px;padding:8px 18px;border:0;border-radius:6px;color:var(--fixed-control-text);background:var(--color-accent-solid)">Accent</button>
    <button style="font-family:var(--font-heading);font-weight:500;font-size:13px;padding:8px 18px;border-radius:6px;background:transparent;color:var(--orange-11);border:1.5px solid var(--color-accent)">Outline</button>
    <button style="font-family:var(--font-heading);font-weight:500;font-size:13px;padding:8px 18px;border-radius:6px;background:transparent;color:var(--fg-2);border:1.5px solid var(--border)">Ghost</button>
    <button style="font-family:var(--font-heading);font-weight:500;font-size:13px;padding:8px 18px;border:0;border-radius:6px;color:var(--on-solid-danger);background:var(--color-danger)">Danger</button>
  </div>
  <div class="row" style="gap:8px;align-items:center;margin-top:4px">
    <button style="font-family:var(--font-heading);font-weight:500;font-size:12px;padding:5px 12px;border:0;border-radius:6px;color:var(--fixed-control-text);background:var(--midnight-9)">Small · 32</button>
    <button style="font-family:var(--font-heading);font-weight:500;font-size:13px;padding:8px 18px;border:0;border-radius:6px;color:var(--fixed-control-text);background:var(--midnight-9)">Medium · 40</button>
    <button style="font-family:var(--font-heading);font-weight:500;font-size:14px;padding:11px 24px;border:0;border-radius:6px;color:var(--fixed-control-text);background:var(--midnight-9)">Large · 48</button>
  </div>
</div>
<script src="card-mode.js"></script>
</body></html>
