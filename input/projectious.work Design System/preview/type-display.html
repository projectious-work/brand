<!doctype html>
<!-- @dsCard group="Brand" name="Type · Display (Plus Jakarta Sans)" subtitle="Display weights and a sample line" viewport="700x326" --><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"></head><body data-theme="light" data-mode="light">
<style>
  .d { font-family:var(--font-heading); color:var(--fg-1); letter-spacing:-0.5px }
  .wt { display:flex; flex-direction:column; gap:2px; align-items:flex-start }
  .wtn { font-family:var(--font-code); font-size:12px; color:var(--fg-3); letter-spacing:0 }
</style>
<div class="col" style="gap:18px">

  <div class="d" style="font-size:44px;font-weight:800;line-height:1.1">Practicing what we build</div>

  <div class="row" style="gap:24px;align-items:baseline">
    <div class="wt"><span class="d" style="font-size:30px;font-weight:400">Aa</span><span class="wtn">400</span></div>
    <div class="wt"><span class="d" style="font-size:30px;font-weight:500">Aa</span><span class="wtn">500</span></div>
    <div class="wt"><span class="d" style="font-size:30px;font-weight:600">Aa</span><span class="wtn">600</span></div>
    <div class="wt"><span class="d" style="font-size:30px;font-weight:700">Aa</span><span class="wtn">700</span></div>
    <div class="wt"><span class="d" style="font-size:30px;font-weight:800">Aa</span><span class="wtn">800</span></div>
  </div>

  <div class="col" style="gap:5px">
    <div class="wtn">Display at its real token size — <span style="font-family:var(--font-code)">--type-display-size</span> 48px / 1.1 / -0.5px</div>
    <div class="d" style="font-size:var(--type-display-size);font-weight:var(--type-display-weight);line-height:var(--type-display-lh)">Redesigning work</div>
  </div>

  <div class="sub">Plus Jakarta Sans — the role that <em>guides attention</em>: display, headings, buttons. Tight tracking (-0.5px) on display sizes; never used for body or code.</div>
</div>
<script src="card-mode.js"></script>
</body></html>
