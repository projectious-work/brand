<!doctype html>
<!-- @dsCard group="Brand" name="Components · Tags & badges" subtitle="Pills neutral (orange = selected) · Badges semantic (info / passed / warning / failed / version)" viewport="700x160" --><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"></head><body data-theme="light" data-mode="light">
<div class="col" style="gap:14px">
  <div>
    <div class="label" style="margin-bottom:6px">Pills · categories &amp; tags (neutral by default, accent = selected)</div>
    <div class="row" style="gap:6px;flex-wrap:wrap;align-items:center">
      <span style="display:inline-flex;padding:3px 10px;border-radius:9999px;font-family:var(--font-body);font-size:12px;font-weight:500;background:var(--surface-2);color:var(--fg-1)">Cloud</span>
      <span style="display:inline-flex;padding:3px 10px;border-radius:9999px;font-family:var(--font-body);font-size:12px;font-weight:500;background:var(--surface-2);color:var(--fg-1)">Agile</span>
      <span style="display:inline-flex;padding:3px 10px;border-radius:9999px;font-family:var(--font-body);font-size:12px;font-weight:500;background:var(--tag-bg-accent);color:var(--tag-text-accent)">Agentic AI</span>
      <span style="display:inline-flex;padding:3px 10px;border-radius:9999px;font-family:var(--font-body);font-size:12px;font-weight:500;background:var(--surface-2);color:var(--fg-1)">Platform</span>
      <span style="display:inline-flex;padding:3px 10px;border-radius:9999px;font-family:var(--font-body);font-size:12px;font-weight:500;background:var(--surface-2);color:var(--fg-1)">FinOps</span>
    </div>
  </div>
  <div>
    <div class="label" style="margin-bottom:6px">Badges · status &amp; metadata (semantic, matches alerts)</div>
    <div class="row" style="gap:6px;flex-wrap:wrap;align-items:center">
      <span style="display:inline-flex;padding:2px 8px;border-radius:3px;font-family:var(--font-heading);font-size:11px;font-weight:600;background:var(--color-info-bg);color:var(--color-info-fg)">Info</span>
      <span style="display:inline-flex;padding:2px 8px;border-radius:3px;font-family:var(--font-heading);font-size:11px;font-weight:600;background:var(--color-success-bg);color:var(--color-success-fg)">Passed</span>
      <span style="display:inline-flex;padding:2px 8px;border-radius:3px;font-family:var(--font-heading);font-size:11px;font-weight:600;background:var(--color-warning-bg);color:var(--color-warning-fg)">Warning</span>
      <span style="display:inline-flex;padding:2px 8px;border-radius:3px;font-family:var(--font-heading);font-size:11px;font-weight:600;background:var(--color-danger-bg);color:var(--color-danger-fg)">Failed</span>
      <span style="display:inline-flex;padding:2px 8px;border-radius:3px;font-family:var(--font-code);font-size:11px;font-weight:500;background:var(--tag-bg);color:var(--tag-text)">v2.1.0</span>
    </div>
  </div>
</div>
<script src="card-mode.js"></script>
</body></html>
