<!doctype html>
<!-- @dsCard group="Brand" name="Components · Cards" subtitle="Flat · raised · with actions" viewport="700x150" --><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"></head><body data-theme="light" data-mode="light">
<div class="row" style="gap:10px">
  <div style="flex:1;background:var(--elevated-1);border:1px solid var(--border);border-radius:9px;overflow:hidden">
    <div style="padding:12px 14px">
      <div style="font-family:var(--font-heading);font-size:13px;font-weight:600;color:var(--fg-1);margin-bottom:3px">Pipeline config</div>
      <div style="font-size:11px;color:var(--fg-2);line-height:1.5">3 stages · Last run 2h ago</div>
    </div>
  </div>
  <div style="flex:1;background:var(--elevated-1);border:1px solid var(--border);border-radius:9px;overflow:hidden;box-shadow:var(--shadow-1)">
    <div style="padding:12px 14px">
      <div style="font-family:var(--font-heading);font-size:13px;font-weight:600;color:var(--fg-1);margin-bottom:3px">Deployment report</div>
      <div style="font-size:11px;color:var(--fg-2);line-height:1.5;margin-bottom:8px">All 12 checks passed.</div>
      <div class="row" style="gap:6px">
        <button style="font-family:var(--font-heading);font-weight:500;font-size:12px;padding:5px 12px;border:0;border-radius:6px;color:var(--fixed-control-text);background:var(--midnight-9)">View</button>
        <button style="font-family:var(--font-heading);font-weight:500;font-size:12px;padding:5px 12px;border-radius:6px;background:transparent;color:var(--orange-11);border:1.5px solid var(--color-accent)">Download</button>
      </div>
    </div>
  </div>
</div>
<script src="card-mode.js"></script>
</body></html>
