<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Agent console — projectious.work</title>
  <link rel="icon" href="../../assets/logo/favicon-32.png">
  <link rel="stylesheet" href="../../colors_and_type.css">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    body { font-family: var(--font-body); color: var(--fg-1); overflow: hidden; }
    #root { height: 100vh; display: flex; flex-direction: column; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="theme.jsx"></script>
  <script type="text/babel" src="Sidebar.jsx"></script>
  <script type="text/babel" src="Topbar.jsx"></script>
  <script type="text/babel" src="PipelineList.jsx"></script>
  <script type="text/babel" src="RunDetail.jsx"></script>
  <script type="text/babel" src="StatusBar.jsx"></script>
  <script type="text/babel">
    const PIPELINES = [
      { id: 1, name: 'validate-deploy',  tag: 'platform/validate-deploy',  status: 'running', lastRun: '2m ago',   owner: 'Jan S.',   runs: 412 },
      { id: 2, name: 'audit-nightly',    tag: 'compliance/audit-nightly',  status: 'healthy', lastRun: '5h ago',   owner: 'Maya R.',  runs: 188 },
      { id: 3, name: 'cost-rebalance',   tag: 'finops/cost-rebalance',     status: 'warning', lastRun: '1d ago',   owner: 'Ahmed K.', runs: 64  },
      { id: 4, name: 'spec-from-issue',  tag: 'agentic/spec-from-issue',   status: 'healthy', lastRun: '12h ago',  owner: 'Lina B.',  runs: 27  },
      { id: 5, name: 'k8s-rollout',      tag: 'platform/k8s-rollout',      status: 'failed',  lastRun: 'yesterday',owner: 'Jan S.',   runs: 301 }
    ];

    function App() {
      const [active, setActive] = React.useState('pipelines');
      const [selectedId, setSelectedId] = React.useState(1);
      const [mode, setMode] = React.useState(() => {
        try { return localStorage.getItem('pw-theme-mode') || 'light'; } catch (e) { return 'light'; }
      });

      const theme = THEMES[mode] || THEMES.light;
      const selected = PIPELINES.find(p => p.id === selectedId);

      React.useEffect(() => {
        try { localStorage.setItem('pw-theme-mode', mode); } catch (e) {}
        document.body.style.background = theme.appBg;
      }, [mode]);

      const toggleMode = () => setMode(m => m === 'dark' ? 'light' : 'dark');

      return (
        <div style={{ display: 'flex', flex: 1, minHeight: 0, background: theme.appBg }}>
          <Sidebar active={active} onNav={setActive} theme={theme} />
          <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0 }}>
            <Topbar title="Pipelines" theme={theme} mode={mode} onToggleMode={toggleMode} />
            <div style={{ flex: 1, overflow: 'auto', padding: 24, background: theme.appBg }}>
              <div style={{ display: 'grid', gridTemplateColumns: '1.3fr 1fr', gap: 18 }}>
                <PipelineList rows={PIPELINES} selectedId={selectedId} onSelect={setSelectedId} theme={theme} />
                <RunDetail pipeline={selected} theme={theme} />
              </div>
            </div>
            <StatusBar theme={theme} />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
