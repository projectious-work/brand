<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:#0e1720;width:1280px;height:720px;overflow:hidden;font-family:var(--font-body);color:#c5daf0}
  .slide{width:1280px;height:720px;position:relative;padding:96px 96px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between}
  .glow{position:absolute;top:-260px;right:-260px;width:680px;height:680px;background:radial-gradient(circle,rgba(224,82,50,0.14) 0%,rgba(224,82,50,0) 65%);pointer-events:none}
  .eyebrow{font-size:14px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#ea7558;margin-bottom:28px}
  h1{font-family:var(--font-heading);font-weight:800;font-size:104px;line-height:1.02;letter-spacing:-2px;color:#fff;margin:0;max-width:1000px}
  .lockup{display:flex;align-items:center;gap:14px;font-family:var(--font-heading);font-weight:700;font-size:18px;color:#fff;letter-spacing:-0.3px}
  .lockup .dot{color:#7490b2}.lockup .work{color:#E05232}
  .meta{display:flex;justify-content:space-between;align-items:flex-end;font-size:13px;color:#97a8b8}
  .meta .right{font-family:var(--font-code);color:#5a6a78}
  .sub{font-family:var(--font-body);font-size:22px;color:#97a8b8;margin-top:32px;max-width:780px;line-height:1.5}
</style></head><body>
<div class="slide">
  <div class="glow"></div>
  <div>
    <div class="lockup"><img src="../assets/logo/icon-dark.svg" width="32" height="32">projectious<span class="dot">·</span><span class="work">work</span></div>
  </div>
  <div>
    <div class="eyebrow">Cloud · Agile · Agentic AI</div>
    <h1>Redesigning work.</h1>
    <div class="sub">Agent-first consulting for organizations adopting AI-native workflows.</div>
  </div>
  <div class="meta">
    <div>Q2 2026 · Investor briefing</div>
    <div class="right">v2.1.0 · slide 01 / 06</div>
  </div>
</div>
</body></html>
