<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"></head><body>
<div class="col" style="gap:8px">
  <div class="row" style="gap:8px;flex-wrap:wrap">
    <button style="font-family:var(--font-heading);font-weight:500;font-size:13px;padding:8px 18px;border:0;border-radius:6px;color:#fff;background:#1d3352">Primary</button>
    <button style="font-family:var(--font-heading);font-weight:500;font-size:13px;padding:8px 18px;border:0;border-radius:6px;color:#fff;background:#E05232">Accent</button>
    <button style="font-family:var(--font-heading);font-weight:500;font-size:13px;padding:8px 18px;border-radius:6px;background:transparent;color:#E05232;border:1.5px solid #E05232">Outline</button>
    <button style="font-family:var(--font-heading);font-weight:500;font-size:13px;padding:8px 18px;border-radius:6px;background:transparent;color:#546a82;border:1.5px solid #cdd0d5">Ghost</button>
    <button style="font-family:var(--font-heading);font-weight:500;font-size:13px;padding:8px 18px;border:0;border-radius:6px;color:#fff;background:#a32d2d">Danger</button>
  </div>
  <div class="row" style="gap:8px;align-items:center;margin-top:4px">
    <button style="font-family:var(--font-heading);font-weight:500;font-size:12px;padding:5px 12px;border:0;border-radius:6px;color:#fff;background:#1d3352">Small · 32</button>
    <button style="font-family:var(--font-heading);font-weight:500;font-size:13px;padding:8px 18px;border:0;border-radius:6px;color:#fff;background:#1d3352">Medium · 40</button>
    <button style="font-family:var(--font-heading);font-weight:500;font-size:14px;padding:11px 24px;border:0;border-radius:6px;color:#fff;background:#1d3352">Large · 48</button>
  </div>
</div>
</body></html>
