<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"></head><body>
<div class="col" style="gap:10px">
  <div class="row" style="gap:14px">
    <div style="flex:1"><div class="label">Success</div>
      <div class="row" style="gap:6px;margin-top:4px"><div style="width:36px;height:36px;border-radius:6px;background:#2d6a4f"></div><div style="flex:1;height:36px;border-radius:6px;background:#d1ebe0"></div></div>
      <div class="mono" style="margin-top:3px">#2d6a4f · #d1ebe0</div>
    </div>
    <div style="flex:1"><div class="label">Warning</div>
      <div class="row" style="gap:6px;margin-top:4px"><div style="width:36px;height:36px;border-radius:6px;background:#8b6508"></div><div style="flex:1;height:36px;border-radius:6px;background:#f5ecd0"></div></div>
      <div class="mono" style="margin-top:3px">#8b6508 · #f5ecd0</div>
    </div>
  </div>
  <div class="row" style="gap:14px">
    <div style="flex:1"><div class="label">Danger</div>
      <div class="row" style="gap:6px;margin-top:4px"><div style="width:36px;height:36px;border-radius:6px;background:#a32d2d"></div><div style="flex:1;height:36px;border-radius:6px;background:#fce8e8"></div></div>
      <div class="mono" style="margin-top:3px">#a32d2d · #fce8e8</div>
    </div>
    <div style="flex:1"><div class="label">Info</div>
      <div class="row" style="gap:6px;margin-top:4px"><div style="width:36px;height:36px;border-radius:6px;background:#1d3352"></div><div style="flex:1;height:36px;border-radius:6px;background:#dae2ec"></div></div>
      <div class="mono" style="margin-top:3px">#1d3352 · #dae2ec</div>
    </div>
  </div>
  <div class="sub">Pair the saturated color with its pale background tint for badges, alerts and callouts.</div>
</div>
</body></html>
