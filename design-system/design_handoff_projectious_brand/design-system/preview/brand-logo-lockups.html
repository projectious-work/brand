<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"></head><body>
<div class="col" style="gap:14px">

  <!-- ============ ONE-LINE LOCKUP ============ -->
  <div class="row" style="gap:6px;align-items:center">
    <img src="../assets/logo/icon-light.svg" width="36" height="36" alt="">
    <span style="font-family:var(--font-heading);font-weight:700;font-size:18px;line-height:1;color:#1d3352;letter-spacing:-0.4px;display:inline-block;transform:translateY(-3px)">projectious</span>
    <span style="width:8px;height:8px;border-radius:50%;background:#7490b2;display:inline-block;transform:translateY(-1px);margin:0 -1px"></span>
    <span style="font-family:var(--font-heading);font-weight:700;font-size:18px;line-height:1;color:#E05232;letter-spacing:-0.4px;display:inline-block;transform:translateY(-3px)">work</span>
    <span class="sub" style="margin-left:14px">One-line · navbars, footers, signatures</span>
  </div>

  <!-- ============ DOT-REPLACE LOCKUP ============ -->
  <div class="row" style="gap:0;align-items:center">
    <span style="font-family:var(--font-heading);font-weight:700;font-size:18px;color:#1d3352;letter-spacing:-0.4px">projectious</span>
    <img src="../assets/logo/icon-light.svg" width="16" height="16" alt="" style="margin:0 1px;transform:translateY(3px)">
    <span style="font-family:var(--font-heading);font-weight:700;font-size:18px;color:#E05232;letter-spacing:-0.4px">work</span>
    <span class="sub" style="margin-left:14px">Dot-replace · documents, CLI</span>
  </div>

  <!-- ============ STACKED LOCKUP ============ -->
  <div class="row" style="gap:18px;align-items:center">
    <div class="col" style="align-items:center;gap:0">
      <img src="../assets/logo/icon-light.svg" width="40" height="40" alt="" style="margin-bottom:0">
      <span style="font-family:var(--font-heading);font-weight:700;font-size:13px;color:#1d3352;line-height:1;margin-top:1px;letter-spacing:-0.2px">projectious</span>
      <div style="display:flex;align-items:center;gap:3px;margin-top:5px;line-height:1">
        <span style="width:5px;height:5px;border-radius:50%;background:#7490b2;display:inline-block;transform:translateY(1px)"></span>
        <span style="font-family:var(--font-heading);font-weight:600;font-size:11px;color:#E05232;letter-spacing:-0.2px;line-height:1">work</span>
      </div>
    </div>
    <span class="sub">Stacked · avatars, app icons</span>
  </div>

</div>
</body></html>
