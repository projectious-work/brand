<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"></head><body>
<div class="col" style="gap:14px">
  <div>
    <div class="label" style="margin-bottom:6px">Pills · categories &amp; tags (neutral by default, accent = selected)</div>
    <div class="row" style="gap:6px;flex-wrap:wrap;align-items:center">
      <span style="display:inline-flex;padding:3px 10px;border-radius:9999px;font-family:var(--font-body);font-size:12px;font-weight:500;background:#eef0f3;color:#1d3352">Cloud</span>
      <span style="display:inline-flex;padding:3px 10px;border-radius:9999px;font-family:var(--font-body);font-size:12px;font-weight:500;background:#eef0f3;color:#1d3352">Agile</span>
      <span style="display:inline-flex;padding:3px 10px;border-radius:9999px;font-family:var(--font-body);font-size:12px;font-weight:500;background:#fae1d8;color:#b84228">Agentic AI</span>
      <span style="display:inline-flex;padding:3px 10px;border-radius:9999px;font-family:var(--font-body);font-size:12px;font-weight:500;background:#eef0f3;color:#1d3352">Platform</span>
      <span style="display:inline-flex;padding:3px 10px;border-radius:9999px;font-family:var(--font-body);font-size:12px;font-weight:500;background:#eef0f3;color:#1d3352">FinOps</span>
    </div>
  </div>
  <div>
    <div class="label" style="margin-bottom:6px">Badges · status &amp; metadata (semantic, matches alerts)</div>
    <div class="row" style="gap:6px;flex-wrap:wrap;align-items:center">
      <span style="display:inline-flex;padding:2px 8px;border-radius:3px;font-family:var(--font-heading);font-size:11px;font-weight:600;background:#dae2ec;color:#1d3352">Info</span>
      <span style="display:inline-flex;padding:2px 8px;border-radius:3px;font-family:var(--font-heading);font-size:11px;font-weight:600;background:#d1ebe0;color:#2d6a4f">Passed</span>
      <span style="display:inline-flex;padding:2px 8px;border-radius:3px;font-family:var(--font-heading);font-size:11px;font-weight:600;background:#f5ecd0;color:#8b6508">Warning</span>
      <span style="display:inline-flex;padding:2px 8px;border-radius:3px;font-family:var(--font-heading);font-size:11px;font-weight:600;background:#fce8e8;color:#a32d2d">Failed</span>
      <span style="display:inline-flex;padding:2px 8px;border-radius:3px;font-family:var(--font-code);font-size:11px;font-weight:500;background:#dae2ec;color:#1d3352">v2.1.0</span>
    </div>
  </div>
</div>
</body></html>
